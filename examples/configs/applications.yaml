# Application & middleware golden-signals reference config.
#
# The complete starter behind the recipes in docs/cookbook/applications.md:
# Kafka consumer lag, HTTP 5xx rate, HTTP p99 latency, and a
# certificate/heartbeat expect:-absence group. Each query fans out over
# its natural identity label (service / consumergroup / topic) via PromQL
# aggregation — no per-service YAML.

apiVersion: promanomaly.io/v1

datasource:
  url: http://victoriametrics:8428/
  timeout: 10s

server:
  listen: ":9092"
  refresh_interval: 1m
  ready_endpoint: true

safety:
  max_series_per_query: 2000
  max_total_series: 20000
  on_source_failure: serve_stale

defaults:
  window: 1h
  step: 15s
  min_points: 60
  warmup_policy: emit_warming_up
  emit_duration: true
  emit_severity: true
  emit_anomaly_type: true
  density_by:
    - service
  alert_thresholds:
    score: 3.0

groups:
  # ---- Kafka consumer lag --------------------------------------------
  - name: kafka_consumer_lag
    priority: 6
    queries:
      - id: kafka_consumergroup_lag
        promql: |
          sum by (consumergroup, topic) (kafka_consumergroup_lag)
        detectors:
          - name: Hampel
            params:
              window: 30m
              t0: 5
          - name: CUSUM

  # ---- HTTP 5xx error fraction ---------------------------------------
  - name: http_errors
    priority: 7
    queries:
      - id: http_5xx_fraction
        promql: |
          sum by (service) (rate(http_requests_total{code=~"5.."}[5m]))
          / clamp_min(sum by (service) (rate(http_requests_total[5m])), 1)
        min_relative_delta: 0.05
        detectors:
          - name: MAD

  # ---- HTTP p99 latency ----------------------------------------------
  - name: http_latency
    priority: 6
    queries:
      - id: http_request_duration_p99
        promql: |
          histogram_quantile(
            0.99,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
          )
        detectors:
          - name: Hampel
            params:
              window: 30m
              t0: 5

  # ---- Certificate / heartbeat absence -------------------------------
  # Absence is the anomaly. expect:true emits anomaly_signal_missing
  # after expect_grace_runs empty runs.
  - name: heartbeats
    priority: 8
    queries:
      - id: nightly_backup_heartbeat
        promql: backup_last_success_timestamp_seconds{job="nightly-backup"}
        expect: true
        expect_grace_runs: 3
        detectors:
          - name: MAD
