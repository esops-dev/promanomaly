# Default values for the promanomaly detector chart.
# Single-replica only — HA mode lands in a later release and adds
# leader election. See README for the operational story.

image:
  repository: ghcr.io/esops-dev/promanomaly
  tag: ""              # overrides Chart.appVersion when set
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 1        # in single-replica mode this MUST stay at 1.
                       # When highAvailability.enabled=true it's safe
                       # to bump (typically to 2 or 3) and the chart
                       # automatically flips to a RollingUpdate strategy
                       # via the override below.

strategy:
  # Recreate is correct for the single-replica MVP. The chart's helper
  # template overrides this to RollingUpdate when
  # highAvailability.enabled=true so HA deployments roll without a
  # downtime window between pod kills and re-elections.
  type: Recreate

# Datasource: the PromQL-compatible TSDB the detector reads from.
datasource:
  url: http://victoria-metrics-single-server:8428/
  timeout: 10s
  auth:
    type: none          # none | bearer | basic | mtls
    existingSecret: ""  # secret name carrying the configured credential

# Reload endpoint protection. The shipped NetworkPolicy denies ingress
# to /-/reload and the debug endpoints by default; auth is defence in
# depth for zero-trust environments.
server:
  listen: ":9092"
  refresh_interval: 1m
  reload:
    enabled: true
    watch_configmap: true
    auth:
      type: none       # none | bearer | mtls
      existingSecret: ""

safety:
  max_series_per_query: 1000
  max_total_series: 20000
  series_overflow: drop_lowest_priority
  detect_timeout: 5s
  query_timeout: 10s
  on_source_failure: serve_stale
  # Only honoured when on_source_failure: fail_ready. A single
  # transient TSDB blip must not take the pod out of the service.
  fail_ready_after: 3
  # In-process LRU+TTL cache for overlapping PromQL responses. The
  # Redis-backed HA variant is selected with ``backend: redis`` and
  # requires the ``redis:`` block below. See docs/operations.md for
  # the worked example.
  query_cache:
    enabled: true
    backend: memory          # memory | redis
    max_entries: 1024
    ttl: 30s

  # Shared Redis settings. Consumed by ``query_cache.backend=redis``
  # and by ``highAvailability.enabled=true``.  Both share one Redis
  # instance; the ``key_prefix`` keeps the snapshot cache and the
  # query cache from colliding inside a database.
  redis:
    url: redis://promanomaly-redis-master:6379/0
    key_prefix: promanomaly
    timeout: 2s

  # Dynamic series discovery (v0.4). Bounds the in-memory tracker so
  # workloads with ephemeral identities (transient pod names, replica
  # IDs that never recycle) don't grow the discovery dict without end.
  # Default of 1000 runs is ~16 hours at the 1m refresh — plenty of
  # time for operators to act on anomaly_signal_missing before the
  # tracker forgets the series.
  discovery:
    forget_after_runs: 1000

# High-availability mode: Lease-based leader election and a Redis-backed
# shared snapshot cache. Off by default (single-replica is the MVP
# topology). When flipped to ``true`` the Deployment switches to
# RollingUpdate, the chart renders a Role + RoleBinding granting the
# Lease verbs, and the Downward API exposes POD_NAME so each replica
# announces its own identity in the Lease.
highAvailability:
  enabled: false
  lease_name: promanomaly-leader
  # Defaults to the release namespace via ``.Release.Namespace`` in the
  # rendered ConfigMap when unset.
  lease_namespace: ""
  lease_duration: 15s
  renew_deadline: 10s
  retry_period: 2s
  snapshot_ttl: 5m

defaults:
  window: 1h
  step: 15s
  min_points: 60
  warmup_policy: emit_warming_up
  emit_baseline: true
  emit_change_points: true
  emit_baseline_stability: true
  emit_duration: true
  alert_thresholds:
    score: 3.0
  # Practical-significance floors. Both default off (0 = no opinion).
  # Setting either gates anomaly_outside_threshold so the alerting bit
  # only fires when the move is statistically AND practically
  # meaningful — useful on sparse counters where MAD's 3-MAD threshold
  # picks up 0.01 -> 0.012 moves that are operational noise.
  # ``anomaly_score`` is unaffected; dashboards still see the raw
  # signal. See docs/operations.md for the worked example.
  min_abs_delta: 0.0      # original-units floor (e.g. 0.05 errors/s)
  min_relative_delta: 0.0  # fraction-of-baseline floor (e.g. 0.05 = 5%)

# Output-label filtering. Applied at the exporter boundary so labels
# carried from the source query never reach Prometheus when they would
# leak privacy/compliance-sensitive identifiers (customer ids, SKUs,
# user-supplied tags). The canonical labels emitted by the detector
# itself (id, group, detector, detector_instance) cannot be stripped.
#
# - ``allow`` (default []): when non-empty, only listed source labels
#   pass through. The canonical labels are always emitted in addition.
# - ``drop`` (default []): always stripped; takes precedence over allow.
#
# See docs/operations.md for a GDPR-style worked example.
exporter:
  output_labels:
    allow: []
    drop: []

# Optional distributed tracing via OpenTelemetry OTLP-gRPC. Off by default;
# leaving ``endpoint`` unset (or empty) means the detector never imports
# the SDK and every ``Telemetry.span(...)`` call is a zero-overhead no-op.
# Set ``endpoint`` (and install the container image with the [otel] extra)
# to emit ``promanomaly.group_run`` / ``promanomaly.query`` /
# ``promanomaly.detect`` spans. See docs/telemetry.md.
telemetry:
  otlp:
    endpoint: ""           # e.g. "otel-collector.observability.svc:4317"
    insecure: true         # set false when the collector terminates TLS
    service_name: promanomaly

# Inline detector groups. Mutually exclusive with ``existingConfigMap``.
#
# REQUIRED: the schema validator rejects a config without at least one
# group, so leaving this empty means the detector pod will CrashLoopBackOff
# at boot. Either fill in groups here or point ``existingConfigMap`` at a
# ConfigMap you manage out-of-band.
groups: []

# Manage the detector config out-of-band (Argo CD / Flux / sealed-secrets).
# When set, the chart skips its own ConfigMap rendering and points the
# Deployment at this ConfigMap instead.
existingConfigMap: ""

service:
  type: ClusterIP
  port: 9092

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podAnnotations: {}
podLabels: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Optional ServiceMonitor for Prometheus Operator setups.
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  honorLabels: true   # required so anomaly labels flow through unchanged

# NetworkPolicy: deny ingress to /-/reload and (future) debug endpoints
# by default. Toggle off if your cluster does not use NetworkPolicies.
networkPolicy:
  enabled: true
  allowedScrapeNamespaces: []   # empty = same namespace only

# Optional bundled PrometheusRule. Off by default — we don't ship
# opinionated thresholds. The rendered manifest mirrors
# ``examples/alerts/promanomaly-rules.yaml`` and is the reference
# starting point operators should tune per their SLOs.
prometheusRule:
  enabled: false
  namespace: ""
  # Labels added to the PrometheusRule object so the kube-prometheus
  # Prometheus picks it up. The default ``release: prometheus`` matches
  # the kube-prometheus-stack default; override to match your release.
  labels:
    release: prometheus
  # Per-group toggles for the bundled rules. Each entry maps to one of
  # the alerts defined in ``examples/alerts/promanomaly-rules.yaml``.
  rules:
    anomalyOutsideThreshold:
      enabled: true
      for: 5m
      severity: warning
    anomalyLongRunning:
      enabled: true
      durationSeconds: 1800
      for: 1m
      severity: critical
    anomalyEnsembleAgreement:
      enabled: true
      for: 5m
      severity: warning
    anomalyChangePoint:
      enabled: true
      window: 10m
      severity: info
    anomalySignalMissing:
      enabled: true
      for: 10m
      severity: critical
    # Calibration-confidence gate. Fires only when a detector is
    # actively firing AND the per-detector confidence has dropped
    # below the configured threshold. See docs/confidence.md for the
    # formula behind anomaly_confidence_score.
    anomalyConfidenceLow:
      enabled: true
      threshold: 0.5
      for: 10m
      severity: warning
    anomalyStale:
      enabled: true
      maxStaleSeconds: 600
      for: 5m
      severity: warning
    anomalyDetectorFailing:
      enabled: true
      rateThreshold: 0.5
      window: 15m
      for: 5m
      severity: warning
    anomalySourceFailing:
      enabled: true
      window: 15m
      for: 10m
      severity: warning
    anomalyNotReady:
      enabled: true
      for: 5m
      severity: critical
