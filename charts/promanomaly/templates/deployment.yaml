{{- /*
  Bearer-token Secret mounts for the active push sink(s). The scalar
  ``sink:`` form mounts a single Secret at /etc/promanomaly-sink-auth; the
  ``sinks:`` list form mounts each sink's Secret under its own
  /etc/promanomaly-sink-auth/<type> directory (the sink type is unique).
  ``$sinkMounts`` is a list of {name, secret, path} consumed by the
  volumeMounts and volumes blocks below so the two never drift.
*/ -}}
{{- $sinkMounts := list -}}
{{- if .Values.sinks -}}
  {{- range $sink := .Values.sinks -}}
    {{- /* ``auth`` is optional on a list entry, so traverse with dig. */ -}}
    {{- $secret := dig $sink.type "auth" "existingSecret" "" $sink -}}
    {{- if $secret -}}
      {{- $name := printf "sink-auth-%s" (replace "_" "-" $sink.type) -}}
      {{- $sinkMounts = append $sinkMounts (dict "name" $name "secret" $secret "path" (include "promanomaly.sinkAuthDir" $sink.type)) -}}
    {{- end -}}
  {{- end -}}
{{- else if .Values.sink.type -}}
  {{- $scalarSecret := dig .Values.sink.type "auth" "existingSecret" "" .Values.sink -}}
  {{- if $scalarSecret -}}
    {{- $sinkMounts = append $sinkMounts (dict "name" "sink-auth" "secret" $scalarSecret "path" "/etc/promanomaly-sink-auth") -}}
  {{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "promanomaly.fullname" . }}
  labels: {{- include "promanomaly.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if .Values.highAvailability.enabled }}
    # HA mode survives a pod restart via leader election + the shared
    # snapshot in Redis, so RollingUpdate is the right strategy. The
    # static value here lets operators still override via
    # ``strategy.type`` without touching the helper template.
    type: {{ default "RollingUpdate" .Values.strategy.type }}
    {{- else }}
    type: {{ .Values.strategy.type }}
    {{- end }}
  selector:
    matchLabels: {{- include "promanomaly.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- /*
          toYaml without `tpl`: rolling the pods on a values change
          only needs a deterministic hash. Running the YAML back
          through `tpl` would re-interpret discovery templates like
          `{{ instance }}` and fail to render.
        */}}
        checksum/config: {{ toYaml .Values | sha256sum }}
      labels:
        {{- include "promanomaly.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "promanomaly.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: promanomaly
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config"
            - "/etc/promanomaly/config.yaml"
          env:
            # Downward API: POD_NAME is read by the leader-election
            # path in HA mode to assign a unique Lease identity per
            # replica. Always set so single-replica deployments
            # log the pod name consistently too.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 9092
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/promanomaly
              readOnly: true
            {{- if .Values.datasource.auth.existingSecret }}
            - name: datasource-auth
              mountPath: /etc/promanomaly-datasource-auth
              readOnly: true
            {{- end }}
            {{- range $sinkMounts }}
            - name: {{ .name }}
              mountPath: {{ .path }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "promanomaly.configMapName" . }}
        {{- if .Values.datasource.auth.existingSecret }}
        - name: datasource-auth
          secret:
            secretName: {{ .Values.datasource.auth.existingSecret | quote }}
        {{- end }}
        {{- range $sinkMounts }}
        - name: {{ .name }}
          secret:
            secretName: {{ .secret | quote }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
