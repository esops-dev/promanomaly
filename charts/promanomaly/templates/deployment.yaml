apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "promanomaly.fullname" . }}
  labels: {{- include "promanomaly.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if .Values.highAvailability.enabled }}
    # HA mode survives a pod restart via leader election + the shared
    # snapshot in Redis, so RollingUpdate is the right strategy. The
    # static value here lets operators still override via
    # ``strategy.type`` without touching the helper template.
    type: {{ default "RollingUpdate" .Values.strategy.type }}
    {{- else }}
    type: {{ .Values.strategy.type }}
    {{- end }}
  selector:
    matchLabels: {{- include "promanomaly.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- /*
          toYaml without `tpl`: rolling the pods on a values change
          only needs a deterministic hash. Running the YAML back
          through `tpl` would re-interpret discovery templates like
          `{{ instance }}` and fail to render.
        */}}
        checksum/config: {{ toYaml .Values | sha256sum }}
      labels:
        {{- include "promanomaly.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "promanomaly.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: promanomaly
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config"
            - "/etc/promanomaly/config.yaml"
          env:
            # Downward API: POD_NAME is read by the leader-election
            # path in HA mode to assign a unique Lease identity per
            # replica. Always set so single-replica deployments
            # log the pod name consistently too.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 9092
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/promanomaly
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "promanomaly.configMapName" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
