{{- if not .Values.existingConfigMap -}}
{{- /*
  Empty .Values.groups renders a config that the detector's pydantic
  schema will reject with a clear error, so the pod CrashLoopBackOffs
  with an actionable message rather than running uselessly. We do NOT
  `fail` here because that would also break ``helm template`` and the
  chart-lint CI job, which renders with default values.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "promanomaly.configMapName" . }}
  labels: {{- include "promanomaly.labels" . | nindent 4 }}
data:
  config.yaml: |
    apiVersion: promanomaly.io/v1
    datasource:
      url: {{ .Values.datasource.url | quote }}
      timeout: {{ .Values.datasource.timeout | quote }}
      auth:
        type: {{ .Values.datasource.auth.type | quote }}
    server:
      listen: {{ .Values.server.listen | quote }}
      refresh_interval: {{ .Values.server.refresh_interval | quote }}
      {{- with .Values.server.expose_warmup_endpoint }}
      expose_warmup_endpoint: {{ . }}
      {{- end }}
      {{- if .Values.server.selftest.enabled }}
      selftest:
        enabled: true
        detector: {{ .Values.server.selftest.detector | quote }}
        threshold: {{ .Values.server.selftest.threshold }}
      {{- end }}
      reload:
        enabled: {{ .Values.server.reload.enabled }}
        watch_configmap: {{ .Values.server.reload.watch_configmap }}
        auth:
          type: {{ .Values.server.reload.auth.type | quote }}
    safety:
      max_series_per_query: {{ .Values.safety.max_series_per_query }}
      max_total_series: {{ .Values.safety.max_total_series }}
      series_overflow: {{ .Values.safety.series_overflow | quote }}
      detect_timeout: {{ .Values.safety.detect_timeout | quote }}
      query_timeout: {{ .Values.safety.query_timeout | quote }}
      on_source_failure: {{ .Values.safety.on_source_failure | quote }}
      {{- with .Values.safety.fail_ready_after }}
      fail_ready_after: {{ . }}
      {{- end }}
      {{- with .Values.safety.query_cache }}
      query_cache:
        enabled: {{ .enabled }}
        {{- with .backend }}
        backend: {{ . | quote }}
        {{- end }}
        max_entries: {{ .max_entries }}
        ttl: {{ .ttl | quote }}
      {{- end }}
      {{- with .Values.safety.redis }}
      redis:
        url: {{ .url | quote }}
        key_prefix: {{ .key_prefix | quote }}
        timeout: {{ .timeout | quote }}
      {{- end }}
      {{- with .Values.safety.discovery }}
      discovery:
        forget_after_runs: {{ .forget_after_runs }}
      {{- end }}
    {{- if .Values.highAvailability.enabled }}
    highAvailability:
      enabled: true
      lease_name: {{ .Values.highAvailability.lease_name | quote }}
      lease_namespace: {{ default .Release.Namespace .Values.highAvailability.lease_namespace | quote }}
      lease_duration: {{ .Values.highAvailability.lease_duration | quote }}
      renew_deadline: {{ .Values.highAvailability.renew_deadline | quote }}
      retry_period: {{ .Values.highAvailability.retry_period | quote }}
      snapshot_ttl: {{ .Values.highAvailability.snapshot_ttl | quote }}
    {{- end }}
    defaults:
      window: {{ .Values.defaults.window | quote }}
      step: {{ .Values.defaults.step | quote }}
      min_points: {{ .Values.defaults.min_points }}
      warmup_policy: {{ .Values.defaults.warmup_policy | quote }}
      emit_baseline: {{ .Values.defaults.emit_baseline }}
      emit_change_points: {{ .Values.defaults.emit_change_points }}
      emit_baseline_stability: {{ .Values.defaults.emit_baseline_stability }}
      emit_duration: {{ .Values.defaults.emit_duration }}
      {{- with .Values.defaults.min_abs_delta }}
      min_abs_delta: {{ . }}
      {{- end }}
      {{- with .Values.defaults.min_relative_delta }}
      min_relative_delta: {{ . }}
      {{- end }}
      alert_thresholds:
        score: {{ .Values.defaults.alert_thresholds.score }}
    {{- if or .Values.exporter.output_labels.allow .Values.exporter.output_labels.drop }}
    exporter:
      output_labels:
        {{- with .Values.exporter.output_labels.allow }}
        allow:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with .Values.exporter.output_labels.drop }}
        drop:
{{ toYaml . | indent 10 }}
        {{- end }}
    {{- end }}
    {{- /*
      Telemetry is rendered only when ``telemetry.otlp.endpoint`` is set —
      writing an empty endpoint into the config would still build the
      Telemetry from_config path correctly (it falls back to the disabled
      singleton on empty endpoints), but rendering nothing keeps the
      rendered ConfigMap diff-clean for operators who don't use tracing.
    */ -}}
    {{- with .Values.telemetry }}
    {{- if and .otlp .otlp.endpoint }}
    telemetry:
      otlp:
        endpoint: {{ .otlp.endpoint | quote }}
        insecure: {{ default true .otlp.insecure }}
        service_name: {{ default "promanomaly" .otlp.service_name | quote }}
    {{- end }}
    {{- end }}
    groups:
{{ toYaml .Values.groups | indent 6 }}
{{- end }}
