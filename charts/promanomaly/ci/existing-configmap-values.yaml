# GitOps-style values: the user manages the detector config out-of-band
# (Argo CD / Flux / sealed-secrets) and points the Deployment at an
# existing ConfigMap. The chart must NOT render its own ConfigMap in
# this mode.

existingConfigMap: promanomaly-config-managed-externally

# `groups:` is intentionally omitted here — when existingConfigMap is
# set the chart skips ConfigMap rendering, so the schema's "at least
# one group" check never runs against this values file.
