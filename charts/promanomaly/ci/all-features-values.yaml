# Render every optional template at once — ServiceMonitor,
# PrometheusRule, NetworkPolicy. Catches conditional-block regressions
# in a single template render.

serviceMonitor:
  enabled: true
  interval: 30s

# End-to-end detection self-test (dead-man's-switch): exercises the
# server.selftest configmap branch and keeps the AnomalyPipelineDead
# rule wired under the matrix render.
server:
  selftest:
    enabled: true
    detector: MAD
    threshold: 3.0

prometheusRule:
  enabled: true
  labels:
    release: prometheus

networkPolicy:
  enabled: true
  allowedScrapeNamespaces:
    - monitoring

safety:
  on_source_failure: fail_ready
  fail_ready_after: 5

defaults:
  # Practical-significance floors: both must be exceeded for the alert
  # bit to fire on top of the statistical threshold. Exercised here so
  # the matrix render covers the YAML surface even when the floors are
  # zero in production.
  min_abs_delta: 0.0
  min_relative_delta: 0.05

# Output-label filtering: covers the exporter.output_labels
# surface so the configmap.yaml conditional block renders under the
# CI matrix. ``allow`` keeps an explicit set of instance/region labels
# on the wire; ``drop`` strips a privacy-sensitive customer id even
# when it would otherwise be in the allow list.
exporter:
  output_labels:
    allow:
      - instance
      - region
      - job
    drop:
      - customer_id

# Telemetry: wire the OTLP block through the configmap render so the
# conditional block (skipped when endpoint is empty) is also exercised
# in the matrix. Operators need to install the container image with the
# [otel] extra for the SDK to be importable at boot.
telemetry:
  otlp:
    endpoint: "otel-collector.observability.svc:4317"
    insecure: true
    service_name: promanomaly-ci

groups:
  - name: ci_full
    priority: 5
    auto_select: explicit_plus_best
    auto_select_interval: 24h
    # Composite gauge fires when at least two detectors agree —
    # high-precision, low-flap signal for the most critical pages.
    ensemble:
      method: voting
      min_detectors: 2
    queries:
      - id: latency
        promql: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))
        # Per-query override: tighten the relative floor on a signal
        # whose normal baseline is very small.
        min_relative_delta: 0.1
        detectors:
          - name: MAD
          - name: Hampel
            instance: long
            params:
              window: 1h
              t0: 5
          - name: IQR
            params:
              k: 1.5
          - name: ZScoreEWMA
            params:
              alpha: 0.05
      - id: heartbeat
        promql: up{job="critical"}
        expect: true
        expect_grace_runs: 2
        detectors:
          - name: MAD
      - id: diurnal_requests
        promql: sum by (instance) (rate(http_requests_total[1m]))
        detectors:
          - name: HourOfDayMAD
            params:
              lookback: 7d
              bucket_width: 1h

  # Cohort detection lives in its own group so its calibration-skip
  # behaviour does not affect the single-series detectors above (mixing
  # them in one auto_select group would silently demote Cohort because
  # only single-series detectors get calibration records). See
  # docs/detectors.md.
  - name: ci_cohort
    priority: 3
    queries:
      - id: cpu_busy_ratio
        promql: 1 - rate(node_cpu_seconds_total{mode="idle"}[5m])
        detectors:
          - name: Cohort
            params:
              cohort_label: instance
              min_cohort_size: 5
