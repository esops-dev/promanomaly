{{- if not .Values.tls.existingSecret }}
{{- include "adapter.certs" . }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ include "adapter.tlsSecretName" . }}
  labels: {{- include "adapter.labels" . | nindent 4 }}
data:
  tls.crt: {{ .adapterCerts.cert.Cert | b64enc }}
  tls.key: {{ .adapterCerts.cert.Key | b64enc }}
  ca.crt: {{ .adapterCerts.ca.Cert | b64enc }}
{{- end }}
