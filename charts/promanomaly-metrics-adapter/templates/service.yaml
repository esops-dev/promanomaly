apiVersion: v1
kind: Service
metadata:
  name: {{ include "adapter.fullname" . }}
  labels: {{- include "adapter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
  selector: {{- include "adapter.selectorLabels" . | nindent 4 }}
