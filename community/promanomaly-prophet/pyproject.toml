[project]
name = "promanomaly-prophet"
version = "0.0.0"
description = "Prophet-residual anomaly detector for promanomaly."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "promanomaly maintainers" }]
keywords = ["prometheus", "anomaly-detection", "prophet", "promanomaly"]

# ``promanomaly`` is the host detector service — we register against
# its entry-point group. ``prophet`` is the actual forecasting library;
# pinned to >=1.1 because earlier releases predate Python 3.12 wheels.
# Operators install with ``pip install promanomaly promanomaly-prophet``.
dependencies = [
    "promanomaly",
    "prophet>=1.1",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
# The test suite stubs ``prophet`` so contributors who don't want to
# install the heavy cmdstan dependency can still run tests. The dev
# extras don't pull ``prophet`` itself for the same reason — CI uses
# the same stubbed path.
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.entry-points."promanomaly.detectors"]
ProphetResidual = "promanomaly_prophet.detector:ProphetResidual"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promanomaly_prophet"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["promanomaly_prophet"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["prophet.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
