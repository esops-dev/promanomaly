[project]
name = "promanomaly"
version = "0.0.0"
description = "Anomaly detection for Prometheus-compatible metrics, exposed as Prometheus metrics."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "promanomaly maintainers" }]
keywords = ["prometheus", "anomaly-detection", "observability", "monitoring"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "structlog>=24.4.0",
    "apscheduler>=3.10.4",
    "prometheus-client>=0.21.0",
    "httpx>=0.27.0",
    "click>=8.1.7",
    "PyYAML>=6.0.2",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    # scipy for the built-in distribution-shift and seasonal-ESD
    # detectors (KS test, Wasserstein distance, t-distribution
    # critical values). Kept in the base install because these are
    # built-in detectors that should work out of the box.
    "scipy>=1.12.0",
    # Redis-backed query + snapshot cache, used in HA mode and any
    # time ``safety.query_cache.backend=redis``. Kept in the base
    # install because the client itself is small (~50KB) and most HA
    # users will also want the single-replica Redis-query-cache path.
    "redis>=5.2.0",
]

[project.optional-dependencies]
# Offline change-point analysis via the ``promanomaly analyze`` CLI.
# Kept as an optional extra because ruptures pulls in scipy and a C
# extension; the detector service itself doesn't need either. Install
# with ``pip install promanomaly[analyze]`` to enable the CLI.
analyze = [
    "ruptures>=1.1.9",
]
# Kubernetes Lease client for HA-mode leader election. Heavy (~10MB
# of generated API stubs) and only consumed when
# ``highAvailability.enabled=true``; install with
# ``pip install promanomaly[ha]`` for multi-replica deployments.
# Single-replica setups don't need the dependency.
ha = [
    "kubernetes>=31.0.0",
]
# OpenTelemetry tracing for the query -> detect -> export pipeline.
# Off by default (zero overhead unless ``telemetry.otlp`` is configured);
# install with ``pip install promanomaly[otel]`` to enable. The SDK
# pulls in protobuf + gRPC, which is why it's an optional extra rather
# than a base dependency.
otel = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]
# Push sinks (remote_write / grafana_annotations). Only the remote-write
# sink needs an extra dependency: ``cramjam`` provides the snappy block
# compression the remote-write 1.0 spec mandates, as a wheel-distributed
# Rust binding with no system libsnappy. Install with
# ``pip install promanomaly[sinks]`` when configuring ``sink:``. The
# WriteRequest protobuf is hand-encoded, so no ``protobuf`` / ``protoc``.
sinks = [
    "cramjam>=2.8.0",
]
# STL-residual detector via statsmodels. Heavy (~30MB) and only consumed
# when the STLResidualMAD detector is configured; install with
# ``pip install promanomaly[seasonal]``.
seasonal = [
    "statsmodels>=0.14.0",
]
# Matrix-profile (discord) shape detector via stumpy. Heavier compute
# and dependency; install with ``pip install promanomaly[matrixprofile]``.
matrixprofile = [
    "stumpy>=1.12.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML",
    "pandas-stubs",
    "ruptures>=1.1.9",
    # Used in unit tests of the Redis-backed query + snapshot caches so
    # they exercise the real ``redis-py`` API surface without requiring
    # an external Redis at test time.
    "fakeredis>=2.26.0",
    # HA-mode test suite needs the kubernetes client too; bundling it
    # with the dev extras means ``uv sync --all-extras`` covers both
    # single-replica and HA test paths.
    "kubernetes>=31.0.0",
    # Snappy compression for the remote-write sink test suite; matches
    # the ``sinks`` extra so ``uv sync --all-extras`` exercises it.
    "cramjam>=2.8.0",
    # STL decomposition for STLResidualMAD test suite; matches the
    # ``seasonal`` extra so ``uv sync --all-extras`` exercises it.
    "statsmodels>=0.14.0",
    # stumpy is NOT included in dev extras because it depends on numba /
    # llvmlite which may not build on the latest Python. MatrixProfile
    # tests stub stumpy entirely. Install ``[matrixprofile]`` explicitly
    # on a supported Python version to exercise the real path.
]

[project.scripts]
promanomaly = "promanomaly.cli:main"

[project.entry-points."promanomaly.detectors"]
MAD = "promanomaly.detectors.mad:MAD"
Hampel = "promanomaly.detectors.hampel:Hampel"
ZScoreEWMA = "promanomaly.detectors.zscore_ewma:ZScoreEWMA"
IQR = "promanomaly.detectors.iqr:IQR"
HourOfDayMAD = "promanomaly.detectors.hour_of_day_mad:HourOfDayMAD"
DayOfWeekMAD = "promanomaly.detectors.day_of_week_mad:DayOfWeekMAD"
BOCPD = "promanomaly.detectors.bocpd:BOCPD"
CUSUM = "promanomaly.detectors.cusum:CUSUM"
Cohort = "promanomaly.detectors.cohort:Cohort"
DistributionShift = "promanomaly.detectors.distribution_shift:DistributionShift"
HistogramDistributionShift = "promanomaly.detectors.histogram_distribution_shift:HistogramDistributionShift"
SeasonalHybridESD = "promanomaly.detectors.seasonal_hybrid_esd:SeasonalHybridESD"
STLResidualMAD = "promanomaly.detectors.stl_residual_mad:STLResidualMAD"
MatrixProfile = "promanomaly.detectors.matrix_profile:MatrixProfile"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promanomaly"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "RUF", "SIM"]
ignore = [
    # FastAPI uses B008 (function call in default arg) for Depends().
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["promanomaly"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "prometheus_client.*",
    "uvicorn.*",
    "ruptures.*",
    "kubernetes.*",
    "fakeredis.*",
    "opentelemetry.*",
    "cramjam.*",
    "statsmodels.*",
    "stumpy.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["promanomaly"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
