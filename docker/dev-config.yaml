# Local-dev config: short rolling window, fast refresh, low min_points so
# scores are produced minutes after the stack starts (instead of after
# an hour of warm-up). Not intended for any non-dev use.

apiVersion: promanomaly.io/v1alpha1

datasource:
  url: http://victoriametrics:8428/
  timeout: 30s

server:
  listen: ":9092"
  refresh_interval: 30s
  reload:
    enabled: true
    watch_configmap: false
  ready_endpoint: true

safety:
  max_series_per_query: 200
  max_total_series: 2000
  series_overflow: drop_lowest_priority
  detect_timeout: 5s
  query_timeout: 10s
  on_source_failure: serve_stale
  # v0.4: drive the query cache through the dev Redis so the
  # anomaly_query_cache_* metrics reflect the real backend rather than
  # only the in-process LRU.
  query_cache:
    enabled: true
    backend: redis
    max_entries: 1024
    ttl: 30s
  redis:
    url: redis://redis:6379/0
    key_prefix: promanomaly
    timeout: 2s

defaults:
  window: 15m
  step: 15s
  min_points: 30
  warmup_policy: emit_warming_up
  emit_baseline: true
  emit_change_points: true
  emit_baseline_stability: true
  emit_duration: true
  alert_thresholds:
    score: 3.0

groups:
  - name: node_dev
    priority: 1
    # explicit_plus_best keeps every detector's score visible in /metrics
    # for local inspection; the winner is just additionally marked.
    auto_select: explicit_plus_best
    auto_select_interval: 5m   # dev-only; production default is 24h
    # Exercise the v0.2 ensemble fuser on the local stack: voting
    # requires two detectors to agree before lighting up the composite
    # gauge. Useful for eyeballing how max vs. voting differ in
    # /metrics while iterating on a new signal.
    ensemble:
      method: voting
      min_detectors: 2
    queries:
      - id: node_cpu_busy_pct
        promql: '100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])))'
        detectors:
          - name: MAD
            params:
              window: 15m
          - name: Hampel
            params:
              window: 15m
              t0: 3
          - name: IQR
            params:
              k: 1.5
          - name: ZScoreEWMA
            params:
              alpha: 0.1

      - id: node_cpu_user_rate
        # Change-point coverage on a related signal: BOCPD + CUSUM exercise
        # the v0.3 wiring (anomaly_change_point_total counter, per-detector
        # threshold override, change-point dashboard). The group-level
        # auto_select still runs here — BOCPD's own threshold parameter
        # makes its calibration F1 comparable to CUSUM's sigma-multiplier
        # F1, so the winner is meaningful rather than always-CUSUM.
        promql: 'avg by (instance) (rate(node_cpu_seconds_total{mode="user"}[1m]))'
        detectors:
          - name: BOCPD
          - name: CUSUM

      # v0.5 stratified detectors. ``lookback`` is shrunk to fit the
      # dev stack — VictoriaMetrics rejects range queries asking for
      # data older than retention with HTTP 422, so a production 4w
      # lookback would fail every refresh against a young dev TSDB.
      # The shrunk values still exercise the sliding-window cache (the
      # heavy query fires every 5 minutes instead of every 30 seconds)
      # and the runner's stitch path; they are NOT the production
      # defaults. See examples/configs/weekly-baseline.yaml for the
      # real-world numbers.
      #
      # Note: this query lives in the ``node_dev`` group which sets
      # ``auto_select: explicit_plus_best`` and leaves the default
      # ``emit_baseline_stability: true``. Auto-select calibration is
      # documented as best-effort for stratified detectors (the
      # synthetic-injection patterns contaminate same-bucket baselines,
      # biasing F1 down), so MAD will usually win the per-series
      # comparison even on signals where the stratified detector is
      # the right answer. The dev stack keeps the default to exercise
      # the full calibration code path; production stratified-only
      # groups should set ``auto_select: false`` and
      # ``defaults.emit_baseline_stability: false`` — see
      # docs/scaling-stratified.md.
      - id: node_cpu_iowait_pct
        promql: '100 * (avg by (instance) (rate(node_cpu_seconds_total{mode="iowait"}[1m])))'
        detectors:
          - name: HourOfDayMAD
            params:
              lookback: 2h
              bucket_width: 1h
              baseline_refresh_interval: 5m
          - name: DayOfWeekMAD
            params:
              lookback: 4h
              bucket_width: 1h
              baseline_refresh_interval: 5m

  - name: cluster_discovered
    priority: 2
    # v0.4: dynamic discovery against the local Prometheus's external
    # ``cluster`` label. The probe harvests every distinct ``cluster``
    # value from ``up{job="node-exporter"}`` and the templated query /
    # id fan out across those values. With one cluster we'll only get
    # one expansion (``cluster=dev``); the wiring still exercises the
    # end-to-end discovery path (probe -> expansion -> fetch -> score)
    # against real VictoriaMetrics, including the rendered metric id.
    # ``instance`` is a tempting axis but its value
    # (``node-exporter:9100``) contains characters Prometheus rejects
    # in metric names, so the dev config picks a discovery label whose
    # values render cleanly.
    queries:
      - id: cluster_cpu_busy_{{ cluster }}
        promql: '100 * (1 - avg by (cluster) (rate(node_cpu_seconds_total{cluster="{{ cluster }}", mode="idle"}[1m])))'
        expect_grace_runs: 3
        discover:
          - variable: cluster
            probe: 'up{job="node-exporter"}'
            label: cluster
        detectors:
          - name: MAD
