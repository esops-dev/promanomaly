# Local-dev config: short rolling window, fast refresh, low min_points so
# scores are produced minutes after the stack starts (instead of after
# an hour of warm-up). Not intended for any non-dev use.

apiVersion: promanomaly.io/v1

datasource:
  url: http://victoriametrics:8428/
  timeout: 30s

server:
  listen: ":9092"
  refresh_interval: 30s
  reload:
    enabled: true
    watch_configmap: false
  ready_endpoint: true

safety:
  max_series_per_query: 200
  max_total_series: 2000
  series_overflow: drop_lowest_priority
  detect_timeout: 5s
  query_timeout: 10s
  on_source_failure: serve_stale
  # v0.4: drive the query cache through the dev Redis so the
  # anomaly_query_cache_* metrics reflect the real backend (entries,
  # misses, expirations, SCAN-based size) rather than only the in-process
  # LRU. Expect anomaly_query_cache_hits_total to sit at ~0 here: the
  # cache only collapses two fetches of the *same* PromQL within one step
  # bucket, but the runner already fetches each query once per tick and
  # shares it across that query's detectors, and refresh_interval (30s) >
  # step (15s) so consecutive ticks land in different buckets. Hits would
  # appear if two query ids shared an identical PromQL. The 0% hit rate is
  # the workload, not a fault — the Redis backend itself is covered by
  # tests/test_redis_cache.py. Redis I/O is offloaded off the event loop
  # (see source.PromQLSource._cache_get), so it stays cheap even at 0%.
  query_cache:
    enabled: true
    backend: redis
    max_entries: 1024
    ttl: 30s
  redis:
    url: redis://redis:6379/0
    key_prefix: promanomaly
    timeout: 2s

defaults:
  window: 15m
  step: 15s
  min_points: 30
  warmup_policy: emit_warming_up
  emit_baseline: true
  emit_change_points: true
  emit_baseline_stability: true
  emit_duration: true
  alert_thresholds:
    score: 3.0

groups:
  - name: node_dev
    priority: 1
    # explicit_plus_best keeps every detector's score visible in /metrics
    # for local inspection; the winner is just additionally marked.
    auto_select: explicit_plus_best
    auto_select_interval: 5m   # dev-only; production default is 24h
    # Exercise the v0.2 ensemble fuser on the local stack: voting
    # requires two detectors to agree before lighting up the composite
    # gauge. Useful for eyeballing how max vs. voting differ in
    # /metrics while iterating on a new signal.
    ensemble:
      method: voting
      min_detectors: 2
    queries:
      - id: node_cpu_busy_pct
        promql: '100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])))'
        detectors:
          - name: MAD
            params:
              window: 15m
          - name: Hampel
            params:
              window: 15m
              t0: 3
          - name: IQR
            params:
              k: 1.5
          - name: ZScoreEWMA
            params:
              alpha: 0.1

      - id: node_cpu_user_rate
        # Change-point coverage on a related signal: BOCPD + CUSUM exercise
        # the v0.3 wiring (anomaly_change_point_total counter, per-detector
        # threshold override, change-point dashboard). The group-level
        # auto_select still runs here — BOCPD's own threshold parameter
        # makes its calibration F1 comparable to CUSUM's sigma-multiplier
        # F1, so the winner is meaningful rather than always-CUSUM.
        promql: 'avg by (instance) (rate(node_cpu_seconds_total{mode="user"}[1m]))'
        detectors:
          - name: BOCPD
          - name: CUSUM

      # v0.5 stratified detectors. ``lookback`` is shrunk to fit the
      # dev stack — VictoriaMetrics rejects range queries asking for
      # data older than retention with HTTP 422, so a production 4w
      # lookback would fail every refresh against a young dev TSDB.
      # The shrunk values still exercise the sliding-window cache (the
      # heavy query fires every 5 minutes instead of every 30 seconds)
      # and the runner's stitch path; they are NOT the production
      # defaults. See examples/configs/weekly-baseline.yaml for the
      # real-world numbers.
      #
      # Note: this query lives in the ``node_dev`` group which sets
      # ``auto_select: explicit_plus_best`` and leaves the default
      # ``emit_baseline_stability: true``. Auto-select calibration is
      # documented as best-effort for stratified detectors (the
      # synthetic-injection patterns contaminate same-bucket baselines,
      # biasing F1 down), so MAD will usually win the per-series
      # comparison even on signals where the stratified detector is
      # the right answer. The dev stack keeps the default to exercise
      # the full calibration code path; production stratified-only
      # groups should set ``auto_select: false`` and
      # ``defaults.emit_baseline_stability: false`` — see
      # docs/scaling-stratified.md.
      - id: node_cpu_iowait_pct
        promql: '100 * (avg by (instance) (rate(node_cpu_seconds_total{mode="iowait"}[1m])))'
        detectors:
          - name: HourOfDayMAD
            params:
              lookback: 2h
              bucket_width: 1h
              baseline_refresh_interval: 5m
          - name: DayOfWeekMAD
            params:
              lookback: 4h
              bucket_width: 1h
              baseline_refresh_interval: 5m

  - name: cluster_discovered
    priority: 2
    # v0.4: dynamic discovery against the local Prometheus's external
    # ``cluster`` label. The probe harvests every distinct ``cluster``
    # value from ``up{job="node-exporter"}`` and the templated query /
    # id fan out across those values. With one cluster we'll only get
    # one expansion (``cluster=dev``); the wiring still exercises the
    # end-to-end discovery path (probe -> expansion -> fetch -> score)
    # against real VictoriaMetrics, including the rendered metric id.
    # ``instance`` is a tempting axis but its value
    # (``node-exporter:9100``) contains characters Prometheus rejects
    # in metric names, so the dev config picks a discovery label whose
    # values render cleanly.
    queries:
      - id: cluster_cpu_busy_{{ cluster }}
        promql: '100 * (1 - avg by (cluster) (rate(node_cpu_seconds_total{cluster="{{ cluster }}", mode="idle"}[1m])))'
        expect_grace_runs: 3
        discover:
          - variable: cluster
            probe: 'up{job="node-exporter"}'
            label: cluster
        detectors:
          - name: MAD

  - name: http_demo
    priority: 3
    # Only populated when the docker-compose ``load`` profile is up
    # (``make dev-up-load``) — the http-demo app and its loadgen are
    # behind that profile. With the minimum dev stack these queries
    # return empty and the detector emits ``anomaly_signal_missing``
    # once ``expect_grace_runs`` is exceeded, which is the intended
    # behaviour: it demonstrates the absence-detection path.
    #
    # That absence demo only fires for queries that set ``expect: true``
    # — ``anomaly_signal_missing`` is gated on it (see runner.py). The
    # reliably-populated queries below opt in; ``http_errors_rate`` does
    # NOT, because it is a deliberately sparse signal (errors are ~7% of
    # ``/api/flaky`` traffic) and would false-fire ``signal_missing``
    # during quiet error windows even while the load profile is up.
    #
    # The loadgen modulates request rate on a 10-minute sine
    # (PERIOD_SECONDS=600 in docker/http-demo/loadgen.py). MAD and
    # Hampel rolling windows are sized at 15m to span more than one
    # full period so the baseline tracks the cycle instead of being
    # offset by it.
    ensemble:
      method: voting
      min_detectors: 2
    queries:
      # Per-endpoint request rate. The bursty, sinusoidal shape from
      # the loadgen produces clear "score moves with the cycle" signal
      # in /metrics, useful for eyeballing detector calibration.
      - id: http_requests_rate
        promql: |
          sum by (endpoint) (
            rate(http_requests_total{endpoint=~"/api/.*|/healthz"}[2m])
          )
        expect: true
        expect_grace_runs: 6
        detectors:
          - name: MAD
            params:
              window: 15m
          - name: Hampel
            params:
              window: 15m
              t0: 3
          - name: ZScoreEWMA
            params:
              alpha: 0.1

      # Error rate. ``/api/flaky`` returns 500 ~7% of the time so this
      # is a sparse intermittent signal — exactly the shape MAD handles
      # well and Gaussian assumptions break on.
      - id: http_errors_rate
        promql: |
          sum by (endpoint) (
            rate(http_requests_total{status=~"5..",endpoint=~"/api/.*|/healthz"}[2m])
          )
        expect_grace_runs: 6
        detectors:
          - name: MAD
            params:
              window: 15m
          - name: IQR
            params:
              k: 1.5

      # p95 latency derived from the histogram. Latency is noisy and
      # tied to load, so a change-point detector earns its keep here.
      #
      # min_abs_delta is the practical-significance floor that makes this
      # query usable. p95 from histogram_quantile snaps to bucket edges
      # (0.005, 0.01, 0.025, 0.05, …), so a fast, stable endpoint like
      # /api/users or /healthz sits on a near-constant ~25ms baseline with
      # a tiny MAD/Hampel spread — a one-bucket quantization wobble then
      # scores 10-100 "MADs" and fires outside_threshold on a
      # sub-millisecond move (it flapped ~40% of runs without this floor).
      # The 50ms floor suppresses those practically-irrelevant wobbles
      # while still letting a real regression (25ms -> 100ms, or the slow
      # endpoint's larger swings) fire. The raw anomaly_score is
      # unaffected — only the alerting bit is gated — so dashboards still
      # see the statistical signal.
      - id: http_request_p95_seconds
        promql: |
          histogram_quantile(
            0.95,
            sum by (endpoint, le) (
              rate(http_request_duration_seconds_bucket{endpoint=~"/api/.*|/healthz"}[2m])
            )
          )
        expect: true
        expect_grace_runs: 6
        min_abs_delta: 0.05
        detectors:
          - name: MAD
            params:
              window: 15m
          - name: Hampel
            params:
              window: 15m
              t0: 3
          - name: CUSUM

      # In-flight concurrency. Gauge, not derived from a counter, so
      # a different shape of series than the rate-based ones above.
      # Two detectors so the group's voting ensemble (min_detectors: 2)
      # can actually fire for this query — a single-detector query under
      # voting yields a composite that can never light up. ZScoreEWMA
      # tracks the level of a smooth concurrency gauge, complementing
      # MAD's robust spread estimate.
      - id: http_in_flight
        promql: max by (job) (http_requests_in_flight)
        expect: true
        expect_grace_runs: 6
        detectors:
          - name: MAD
            params:
              window: 15m
          - name: ZScoreEWMA
            params:
              alpha: 0.1
